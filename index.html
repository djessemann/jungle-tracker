<script>
"use strict";
/* ---------------------------------------------------------------- FONT
   5x7 pixel glyphs in a 6x8 cell. Rows encoded base32, bit 16 = leftmost.
   Codes 32..95 are ASCII (uppercase only). 96..111 are icons.          */
var FONTDATA =
/* 32 */ "0000000"+"4444404"+"AA00000"+"AAVAVAA"+"4FKE5U4"+"PP248JJ"+"CIK8LID"+"4400000"+
/* 40 */ "2488842"+"8422248"+"0A4V4A0"+"044V440"+"0000048"+"000V000"+"0000004"+"01248G0"+
/* 48 */ "EHJLPHE"+"4C4444E"+"EH1248V"+"V2421HE"+"26AIV22"+"VGU11HE"+"68GUHHE"+"V124888"+
/* 56 */ "EHHEHHE"+"EHHF12C"+"0CC0CC0"+"0CC0C48"+"248G842"+"00V0V00"+"8421248"+"EH12404"+
/* 64 */ "EH1DLLE"+"EHHVHHH"+"UHHUHHU"+"EHGGGHE"+"UHHHHHU"+"VGGUGGV"+"VGGUGGG"+"EHGNHHE"+
/* 72 */ "HHHVHHH"+"V44444V"+"722229C"+"HIKOKIH"+"GGGGGGV"+"HRLHHHH"+"HPLJHHH"+"EHHHHHE"+
/* 80 */ "UHHUGGG"+"EHHHLID"+"UHHUKIH"+"FGGE11U"+"V444444"+"HHHHHHE"+"HHHHHA4"+"HHHHLRH"+
/* 88 */ "HHA4AHH"+"HHHA444"+"V1248GV"+"E88888E"+"0G84210"+"E22222E"+"4AH0000"+"000000V"+
/* 96 */ "GOSUSOG"+"0VVVVV0"+"0EVVVE0"+"137F731"+"GOSUSOG"+"044EEV0"+"0VEE440"+"0129A40"+
/*104 */ "0HA4AH0"+"00EEE00"+"0RRRRR0"+"VVVVVVV"+"LALALAL"+"ALALALA"+"VHLHVE0"+"0EHHHE0";

var B32 = "0123456789ABCDEFGHIJKLMNOPQRSTUV";
var GW = 6, GH = 8, NGLYPH = 80;

/* icon characters */
var I_PLAY="`", I_STOP="a", I_REC="b", I_LT="c", I_RT="d", I_UP="e", I_DN="f",
    I_OK="g", I_X="h", I_DOT="i", I_PAUSE="j", I_BLOCK="k", I_DITH="l", I_DITH2="m",
    I_DISK="n", I_KNOB="o";

/* Amiga Workbench 1.3 palette */
var PAL = ["#000000","#FFFFFF","#0055AA","#FF8800"];
var BLACK=0, WHITE=1, BLUE=2, ORANGE=3;

var atlas = [];

function buildFont(){
  atlas = [];
  for(var p=0;p<PAL.length;p++){
    var cv = document.createElement("canvas");
    cv.width = NGLYPH*GW; cv.height = GH;
    var cx = cv.getContext("2d");
    var img = cx.createImageData(cv.width, GH);
    var hex = PAL[p];
    var r = parseInt(hex.substr(1,2),16), g = parseInt(hex.substr(3,2),16), b = parseInt(hex.substr(5,2),16);
    for(var i=0;i<NGLYPH;i++){
      for(var row=0;row<7;row++){
        var v = B32.indexOf(FONTDATA.charAt(i*7+row));
        if(v<0) v=0;
        for(var c=0;c<5;c++){
          if(v & (16>>c)){
            var o = ((row*cv.width)+(i*GW+c))*4;
            img.data[o]=r; img.data[o+1]=g; img.data[o+2]=b; img.data[o+3]=255;
          }
        }
      }
    }
    cx.putImageData(img,0,0);
    atlas.push(cv);
  }
}
/* ---------------------------------------------------------------- GFX */
var cvs = document.getElementById("c");
var ctx = cvs.getContext("2d", {alpha:false});
var W = 240, H = 400, PIX = 3;
var dirty = true;
function mark(){ dirty = true; }

function resize(){
  var dpr = window.devicePixelRatio || 1;
  var cw = window.innerWidth, ch = window.innerHeight;
  var dw = Math.floor(cw*dpr), dh = Math.floor(ch*dpr);
  cvs.width = dw; cvs.height = dh;
  cvs.style.width = cw+"px"; cvs.style.height = ch+"px";
  var target = (cw > 700) ? 400 : 250;          /* app pixels across */
  PIX = Math.max(1, Math.round(dw/target));
  W = Math.floor(dw/PIX); H = Math.floor(dh/PIX);
  ctx.setTransform(PIX,0,0,PIX,0,0);
  ctx.imageSmoothingEnabled = false;
  mark();
}

function rect(x,y,w,h,c){ ctx.fillStyle = PAL[c]; ctx.fillRect(x|0,y|0,w|0,h|0); }
function frame(x,y,w,h,c){ rect(x,y,w,1,c); rect(x,y+h-1,w,1,c); rect(x,y,1,h,c); rect(x+w-1,y,1,h,c); }

/* Workbench bevels: light top-left, dark bottom-right (out) and reverse (in) */
function bevel(x,y,w,h,inset){
  var a = inset?BLACK:WHITE, b = inset?WHITE:BLACK;
  rect(x,y,w-1,1,a); rect(x,y,1,h-1,a);
  rect(x+w-1,y,1,h,b); rect(x,y+h-1,w,1,b);
}
function panel(x,y,w,h,fill,inset){
  if(fill>=0) rect(x,y,w,h,fill);
  bevel(x,y,w,h,inset);
}
/* 50% checkerboard fill, the period way to make a grey */
function dither(x,y,w,h,c){
  ctx.fillStyle = PAL[c];
  x=x|0;y=y|0;w=w|0;h=h|0;
  for(var j=0;j<h;j++){
    for(var i=(j&1);i<w;i+=2) ctx.fillRect(x+i,y+j,1,1);
  }
}

function text(x,y,s,c){
  if(s==null) return;
  s = ""+s;
  var a = atlas[c];
  for(var i=0;i<s.length;i++){
    var g = s.charCodeAt(i)-32;
    if(g<=0||g>=NGLYPH) continue;
    ctx.drawImage(a, g*GW, 0, GW, GH, (x|0)+i*GW, y|0, GW, GH);
  }
}
function textC(x,y,w,s,c){ text(x + ((w - (""+s).length*GW)>>1), y, s, c); }
function textR(x,y,s,c){ text(x - (""+s).length*GW, y, s, c); }
function tw(s){ return (""+s).length*GW; }

var HEX = "0123456789ABCDEF";
function hx(n,d){
  n = Math.max(0,Math.round(n));
  var s = "";
  while(n>0){ s = HEX.charAt(n&15)+s; n>>=4; }
  while(s.length<(d||2)) s = "0"+s;
  return s;
}
function pad(n,d){ var s=""+n; while(s.length<d) s="0"+s; return s; }

/* ------------------------------------------------------------- WIDGETS */
var regions = [];
function hit(x,y,w,h,o){ o.x=x;o.y=y;o.w=w;o.h=h; regions.push(o); return o; }

function button(x,y,w,h,label,on,active){
  var down = isDown(x,y,w,h);
  var ins = active || down;
  panel(x,y,w,h,ins?WHITE:BLUE,ins);
  textC(x,y+((h-7)>>1),w,label,ins?BLUE:WHITE);
  hit(x,y,w,h,{tap:on});
}
function tinyButton(x,y,w,h,label,on,active){
  var down = isDown(x,y,w,h);
  var ins = active||down;
  panel(x,y,w,h,ins?ORANGE:BLUE,ins);
  textC(x,y+((h-7)>>1),w,label,ins?BLACK:WHITE);
  hit(x,y,w,h,{tap:on});
}

/* ------------------------------------------------------------- INPUT */
var pointers = {};
var HOLD_MS = 380, SLOP = 4;

function isDown(x,y,w,h){
  for(var k in pointers){
    var p = pointers[k];
    if(!p.down) continue;
    if(p.x>=x&&p.x<x+w&&p.y>=y&&p.y<y+h&&p.r&&p.r.x===x&&p.r.y===y) return true;
  }
  return false;
}
function pick(x,y){
  for(var i=regions.length-1;i>=0;i--){
    var r = regions[i];
    if(x>=r.x&&x<r.x+r.w&&y>=r.y&&y<r.y+r.h) return r;
  }
  return null;
}
function evPos(e){
  var b = cvs.getBoundingClientRect();
  return { x:(e.clientX-b.left)*(cvs.width/b.width)/PIX, y:(e.clientY-b.top)*(cvs.height/b.height)/PIX };
}
function onDown(e){
  e.preventDefault();
  audioUnlock();
  var p = evPos(e);
  var r = pick(p.x,p.y);
  var st = {x:p.x,y:p.y,x0:p.x,y0:p.y,px:p.x,py:p.y,r:r,moved:false,down:true,held:false,t:now()};
  pointers[e.pointerId] = st;
  if(r&&r.down) r.down(p.x-r.x,p.y-r.y,st);
  if(r&&r.hold){
    st.timer = setTimeout(function(){
      if(!st.moved && st.down){ st.held = true; r.hold(st.x-r.x,st.y-r.y); mark(); }
    }, HOLD_MS);
  }
  mark();
}
function onMove(e){
  var st = pointers[e.pointerId]; if(!st) return;
  e.preventDefault();
  var p = evPos(e);
  st.px = st.x; st.py = st.y; st.x = p.x; st.y = p.y;
  if(Math.abs(p.x-st.x0)>SLOP||Math.abs(p.y-st.y0)>SLOP) st.moved = true;
  if(st.r&&st.r.drag) st.r.drag(p.x-st.r.x, p.y-st.r.y, p.x-st.px, p.y-st.py, st);
  mark();
}
function onUp(e){
  var st = pointers[e.pointerId]; if(!st) return;
  e.preventDefault();
  if(st.timer) clearTimeout(st.timer);
  st.down = false;
  var r = st.r;
  if(r){
    if(r.up) r.up(st.x-r.x, st.y-r.y, st);
    if(!st.moved && !st.held && r.tap) r.tap(st.x-r.x, st.y-r.y, st);
  }
  delete pointers[e.pointerId];
  mark();
}
function bindInput(){
  cvs.addEventListener("pointerdown", onDown, {passive:false});
  cvs.addEventListener("pointermove", onMove, {passive:false});
  cvs.addEventListener("pointerup", onUp, {passive:false});
  cvs.addEventListener("pointercancel", onUp, {passive:false});
  cvs.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  document.addEventListener("gesturestart", function(e){ e.preventDefault(); });
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function(){ setTimeout(resize,120); });
}
function now(){ return (typeof performance!=="undefined"?performance.now():Date.now()); }
/* ---------------------------------------------------------------- AUDIO
   The engine is a factory so the offline renderer can build an identical
   graph in an OfflineAudioContext.                                      */

var NCH = 6;
var CHNAME = ["BRK1","BRK2","SUB","REESE","STAB","FX"];

function noteFreq(m){ return 440*Math.pow(2,(m-69)/12); }
var NOTENAMES = ["C-","C#","D-","D#","E-","F-","F#","G-","G#","A-","A#","B-"];
function noteToMidi(s){
  if(!s) return -1;
  var n = NOTENAMES.indexOf(s.substr(0,2));
  if(n<0) return -1;
  var o = parseInt(s.charAt(2),10);
  if(isNaN(o)) return -1;
  return (o+1)*12+n;
}
function midiToNote(m){ return NOTENAMES[((m%12)+12)%12] + Math.max(0,Math.floor(m/12)-1); }

function softCurve(amount){
  var n = 2048, c = new Float32Array(n), k = amount;
  for(var i=0;i<n;i++){
    var x = i*2/n-1;
    c[i] = Math.tanh(x*k)/Math.tanh(k);
  }
  return c;
}
function crushCurve(bits){
  var n = 4096, c = new Float32Array(n);
  var steps = Math.pow(2, bits)/2;
  for(var i=0;i<n;i++){
    var x = i*2/n-1;
    c[i] = Math.round(x*steps)/steps;
  }
  return c;
}

function makeNoise(ac){
  var b = ac.createBuffer(1, Math.floor(ac.sampleRate*2), ac.sampleRate);
  var d = b.getChannelData(0);
  var s = 22222;
  for(var i=0;i<d.length;i++){ s = (s*1103515245+12345)&0x7fffffff; d[i] = (s/0x40000000)-1; }
  return b;
}
function makeIR(ac, secs, dark){
  var len = Math.floor(ac.sampleRate*secs);
  var b = ac.createBuffer(2, len, ac.sampleRate);
  var s = 99991;
  for(var c=0;c<2;c++){
    var d = b.getChannelData(c), lp = 0;
    for(var i=0;i<len;i++){
      s = (s*1103515245+12345)&0x7fffffff;
      var v = (s/0x40000000)-1;
      lp += (v-lp)*dark;                       /* one pole = dark room */
      var t = i/len;
      d[i] = lp*Math.pow(1-t,3.2)*(i<40?i/40:1);
    }
  }
  return b;
}

var engSeq = 0;
function createEngine(ac){
  var E = { ac:ac, ch:[], t0:0, id:(++engSeq) };
  E.noise = makeNoise(ac);

  var comp = ac.createDynamicsCompressor();
  comp.threshold.value = -8; comp.knee.value = 6; comp.ratio.value = 8;
  comp.attack.value = 0.003; comp.release.value = 0.12;
  var shaper = ac.createWaveShaper();
  shaper.curve = softCurve(1.9);
  var master = ac.createGain(); master.gain.value = 0.85;
  master.connect(shaper); shaper.connect(comp); comp.connect(ac.destination);
  E.master = master;

  /* dub delay: lowpass inside the feedback loop */
  var dly = ac.createDelay(2.0); dly.delayTime.value = 0.264;
  var fb = ac.createGain(); fb.gain.value = 0.42;
  var dlp = ac.createBiquadFilter(); dlp.type="lowpass"; dlp.frequency.value = 2200; dlp.Q.value=0.7;
  var dhp = ac.createBiquadFilter(); dhp.type="highpass"; dhp.frequency.value = 180;
  var dlyIn = ac.createGain();
  var dlyOut = ac.createGain(); dlyOut.gain.value = 0.9;
  dlyIn.connect(dly); dly.connect(dlp); dlp.connect(dhp); dhp.connect(fb); fb.connect(dly);
  dly.connect(dlyOut); dlyOut.connect(master);
  E.delay = dly; E.delayFb = fb; E.delayIn = dlyIn;

  /* dark plate */
  var rev = ac.createConvolver(); rev.buffer = makeIR(ac, 2.2, 0.32);
  var revIn = ac.createGain();
  var rlp = ac.createBiquadFilter(); rlp.type="lowpass"; rlp.frequency.value=3200;
  var revOut = ac.createGain(); revOut.gain.value = 0.9;
  revIn.connect(rev); rev.connect(rlp); rlp.connect(revOut); revOut.connect(master);
  E.revIn = revIn;

  for(var i=0;i<NCH;i++){
    var c = {};
    c.in = ac.createGain(); c.in.gain.value = 1;
    c.flt = ac.createBiquadFilter(); c.flt.type="lowpass"; c.flt.frequency.value=18000; c.flt.Q.value=0.9;
    c.crush = ac.createWaveShaper(); c.crush.curve = crushCurve(16);
    c.clp = ac.createBiquadFilter(); c.clp.type="lowpass"; c.clp.frequency.value=20000;
    c.vol = ac.createGain(); c.vol.gain.value = 0.8;
    c.dry = ac.createGain(); c.dry.gain.value = 1;
    c.dsend = ac.createGain(); c.dsend.gain.value = 0;
    c.rsend = ac.createGain(); c.rsend.gain.value = 0;
    c.in.connect(c.flt); c.flt.connect(c.crush); c.crush.connect(c.clp); c.clp.connect(c.vol);
    c.vol.connect(c.dry); c.dry.connect(master);
    c.vol.connect(c.dsend); c.dsend.connect(dlyIn);
    c.vol.connect(c.rsend); c.rsend.connect(revIn);
    c.mono = null;
    E.ch.push(c);
  }

  E.setMix = function(i,m){
    var c = E.ch[i];
    c.vol.gain.value = m.mute?0:(m.vol*m.vol);
    c.flt.frequency.value = 40*Math.pow(400, m.cut);
    c.flt.Q.value = 0.8 + m.res*8;
    var bits = 16 - Math.round(m.crush*10);
    c.crush.curve = crushCurve(bits);
    c.clp.frequency.value = m.crush>0 ? 20000*Math.pow(0.28, m.crush) : 20000;
    c.dsend.gain.value = m.dly*m.dly;
    c.rsend.gain.value = m.rev*m.rev;
  };
  E.setDelayTime = function(t){ E.delay.delayTime.value = Math.min(1.99,t); };
  E.trigger = function(o){ return trigger(E,o); };
  E.release = function(ch,when){ releaseMono(E,ch,when); };
  E.panic = function(){
    for(var i=0;i<NCH;i++){ if(E.ch[i].mono){ try{E.ch[i].mono.stop(0);}catch(e){} E.ch[i].mono=null; } }
  };
  return E;
}

/* ------------------------------------------------------------- VOICES */
function adsr(g, t, a, d, s, dur, r, peak){
  g.setValueAtTime(0.0001, t);
  g.exponentialRampToValueAtTime(Math.max(0.0002,peak), t+a);
  g.exponentialRampToValueAtTime(Math.max(0.0002,peak*s), t+a+d);
  var off = t+Math.max(dur, a+d);
  g.setValueAtTime(Math.max(0.0002,peak*s), off);
  g.exponentialRampToValueAtTime(0.0001, off+r);
  return off+r;
}
function decay(g, t, peak, len){
  g.setValueAtTime(peak, t);
  g.exponentialRampToValueAtTime(0.0001, t+len);
}
function osc(ac,type,f,t){ var o=ac.createOscillator(); o.type=type; o.frequency.setValueAtTime(f,t); return o; }
function noiseSrc(E,t){ var s=E.ac.createBufferSource(); s.buffer=E.noise; s.loop=true;
  s.playbackRate.value = 1; return s; }

/* --- synthesized kit ------------------------------------------------ */
function kitVoice(E, name, when, out, gain, pitch){
  var ac = E.ac, t = when, g = ac.createGain(); g.connect(out);
  var p = Math.pow(2, (pitch||0)/12);
  var v = (gain==null?1:gain);
  function tone(type,f0,f1,tm,len,amp){
    var o = osc(ac,type,f0*p,t), og = ac.createGain();
    if(f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(20,f1*p), t+tm);
    decay(og.gain, t, amp, len);
    o.connect(og); og.connect(g); o.start(t); o.stop(t+len+0.02);
  }
  function nz(type,f,q,len,amp,at){
    at = at||0;
    var s = noiseSrc(E,t), f1 = ac.createBiquadFilter(), ng = ac.createGain();
    f1.type = type; f1.frequency.value = f*(type==="bandpass"?p:1); f1.Q.value = q;
    s.connect(f1); f1.connect(ng); ng.connect(g);
    if(at){ ng.gain.setValueAtTime(0.0001,t); ng.gain.exponentialRampToValueAtTime(amp,t+at);
            ng.gain.exponentialRampToValueAtTime(0.0001,t+at+len); }
    else decay(ng.gain, t, amp, len);
    s.start(t, (t*7919)%1.5); s.stop(t+len+at+0.02);
  }
  g.gain.value = v;
  switch(name){
    case "KICK8": tone("sine",120,42,0.075,0.62,1.0); nz("highpass",1200,0.7,0.012,0.35); break;
    case "BOOM":  tone("sine",64,44,0.10,1.30,1.0); break;
    case "KICK":  tone("sine",210,58,0.030,0.20,1.0); nz("highpass",2400,0.7,0.010,0.30); break;
    case "SNARE": tone("triangle",196,150,0.05,0.10,0.55); nz("bandpass",1750,0.9,0.13,0.75); break;
    case "SNR2":  tone("triangle",232,180,0.05,0.09,0.40); nz("bandpass",2900,0.5,0.26,0.85); break;
    case "GHOST": tone("triangle",180,150,0.03,0.04,0.18); nz("bandpass",1900,1.2,0.045,0.30); break;
    case "RIM":   tone("square",1720,1400,0.006,0.020,0.30); nz("bandpass",2400,4.0,0.030,0.45); break;
    case "CLAP":  nz("bandpass",1400,1.4,0.16,0.8,0.004); break;
    case "HAT":   nz("highpass",8600,0.7,0.032,0.55); break;
    case "OHAT":  nz("highpass",8200,0.7,0.30,0.45); break;
    case "RIDE":  nz("highpass",9200,0.7,0.55,0.30); tone("square",3100,3100,0,0.30,0.05); break;

/* --- sample slice --------------------------------------------------- */
function playBuf(E, buf, out, when, start, len, rate, gain, rev, grain){
  var ac = E.ac;
  if(!buf) return;
  if(start >= buf.duration-0.001) return;
  if(start < 0) start = 0;
  var g = ac.createGain(); g.gain.value = gain; g.connect(out);
  var src;
  if(rev){
    buf = reverseBuf(E, buf);
    start = Math.max(0, buf.duration - start - len);
  }
  if(grain>0){
    /* granular stretch: keep pitch, fill `grain.dur` seconds from `len` */
    var gd = grain.size, hop = gd*0.5, total = grain.dur;
    var ratio = (len>0? len/total : 1);
    var n = Math.max(1, Math.ceil(total/hop));
    for(var i=0;i<n;i++){
      var gt = when + i*hop;
      var pos = start + i*hop*ratio;
      if(pos > buf.duration-0.001) break;
      var s2 = ac.createBufferSource(); s2.buffer = buf; s2.playbackRate.value = rate;
      var g2 = ac.createGain();
      g2.gain.setValueAtTime(0.0001, gt);
      g2.gain.linearRampToValueAtTime(1, gt+gd*0.25);
      g2.gain.setValueAtTime(1, gt+gd*0.5);
      g2.gain.linearRampToValueAtTime(0.0001, gt+gd);
      s2.connect(g2); g2.connect(g);
      s2.start(gt, pos, gd*rate+0.01); s2.stop(gt+gd+0.02);
    }
    return g;
  }
  src = ac.createBufferSource(); src.buffer = buf; src.playbackRate.value = rate;
  src.connect(g);
  var dur = Math.min(len, Math.max(0.005,(buf.duration-start)))/rate;
  g.gain.setValueAtTime(gain, when);
  g.gain.setValueAtTime(gain, when+Math.max(0.005,dur-0.004));
  g.gain.linearRampToValueAtTime(0.0001, when+dur+0.004);
  try{ src.start(when, Math.max(0,start), (buf.duration-start)); }catch(e){ try{src.start(when);}catch(e2){} }
  src.stop(when+dur+0.02);
  return g;
}
var revCache = {};
function reverseBuf(E, buf){
  if(buf._rev) return buf._rev;
  var ac = E.ac;
  var b = ac.createBuffer(buf.numberOfChannels, buf.length, buf.sampleRate);
  for(var c=0;c<buf.numberOfChannels;c++){
    var s = buf.getChannelData(c), d = b.getChannelData(c), n = buf.length;
    for(var i=0;i<n;i++) d[i] = s[n-1-i];
  }
  buf._rev = b;
  return b;
}

function releaseMono(E, ch, when){
  var m = E.ch[ch].mono;
  if(!m) return;
  E.ch[ch].mono = null;
  var g = m.g.gain;
  try{
    g.cancelScheduledValues(when);
    g.setValueAtTime(Math.max(0.0002,g.value), when);
    g.exponentialRampToValueAtTime(0.0001, when+0.03);
  }catch(e){}
  for(var i=0;i<m.o.length;i++){ try{ m.o[i].stop(when+0.06); }catch(e){} }
}

/* main trigger. o = {ch,inst,note,when,dur,vel,fx,brk,slice,sustain,out} */
function trigger(E, o){
  var ac = E.ac, c = E.ch[o.ch], out = o.out || c.in;
  var inst = o.inst, ip = inst.p, t = o.when, vel = (o.vel==null?1:o.vel);
  var fx = o.fx || {};
  var gain = (ip.GAIN==null?1:ip.GAIN)*vel;
  var semis = fx.P||0;

  if(fx.C!=null){
    var f = 40*Math.pow(400, fx.C);
    try{ c.flt.frequency.setTargetAtTime(f, t, 0.005); }catch(e){ c.flt.frequency.value=f; }
  }

  switch(inst.t){
    case "brk": return playBreak(E,o,gain,semis);
    case "kit": {
      var kd = KITLIST[Math.max(0,Math.min(KITLIST.length-1,(o.slice||1)-1))];
      kitVoice(E, kd, t, out, gain, (ip.TUNE||0)+semis);
      return;
    }
    case "smp": {
      var buf = o.buf;
      if(!buf) return;
      var midi = (o.midi==null?60:o.midi);
      var rate = Math.pow(2, (midi-60+(ip.TUNE||0)+semis)/12);
      playBuf(E, buf, out, t, 0, Math.min(buf.duration, (ip.GATE||2)), rate, gain, !!fx.B, 0);
      return;
    }
    case "sub":  return monoVoice(E,o,"sub",gain,semis);
    case "reese":return monoVoice(E,o,"reese",gain,semis);
    case "wob":  return monoVoice(E,o,"wob",gain,semis);
    case "hoov": {
      var f0 = noteFreq(o.midi+semis), g = ac.createGain(); g.connect(out);
      var dec = ip.DEC, det = ip.DET;
      var lp = ac.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=ip.CUT; lp.Q.value=6;
      lp.connect(g);
      var lfo = osc(ac,"sine",5.5,t), lg = ac.createGain(); lg.gain.value = det*0.7;
      lfo.connect(lg); lfo.start(t); lfo.stop(t+dec+0.4);
      var types = ["sawtooth","sawtooth","square","sawtooth"], dts=[-det,det,-det*0.5,det*2];
      for(var i=0;i<4;i++){
        var oo = osc(ac,types[i],f0,t);
        oo.detune.setValueAtTime(dts[i]+(ip.SWEEP*100), t);
        oo.detune.exponentialRampToValueAtTime(Math.abs(dts[i])+1, t+ip.STIME);
        oo.detune.setTargetAtTime(dts[i], t+ip.STIME, 0.1);
        lg.connect(oo.detune);
        oo.connect(lp); oo.start(t); oo.stop(t+dec+0.3);
      }
      var end = adsr(g.gain, t, 0.006, 0.05, 0.75, Math.min(o.dur,dec), dec*0.5, gain*0.28);
      return;
    }
    case "chord": {
      var iv = CHORDS[Math.round(ip.TYPE)%CHORDS.length];
      var g2 = ac.createGain(); g2.connect(out);
      var lp2 = ac.createBiquadFilter(); lp2.type="lowpass"; lp2.frequency.setValueAtTime(ip.CUT,t);
      lp2.frequency.exponentialRampToValueAtTime(Math.max(200,ip.CUT*0.35), t+ip.DEC);
      lp2.Q.value = 2.5; lp2.connect(g2);
      for(var k=0;k<iv.length;k++){
        for(var d2=0;d2<2;d2++){
          var oc = osc(ac,d2?"square":"sawtooth", noteFreq(o.midi+iv[k]+semis), t);
          oc.detune.value = (d2? ip.DET : -ip.DET);
          oc.connect(lp2); oc.start(t); oc.stop(t+ip.DEC+0.15);
        }
      }
      adsr(g2.gain, t, Math.max(0.001,ip.ATK), ip.DEC*0.7, 0.12, Math.min(o.dur,ip.DEC), ip.DEC*0.4, gain*0.16);
      return;
    }
    case "pad": {
      var g3 = ac.createGain(); g3.connect(out);
      var lp3 = ac.createBiquadFilter(); lp3.type="lowpass"; lp3.frequency.value=ip.CUT; lp3.Q.value=1.2;
      lp3.connect(g3);
      var f3 = noteFreq(o.midi+semis);
      var dt = [-ip.DET,-ip.DET*0.3,ip.DET*0.4,ip.DET];
      for(var q=0;q<4;q++){
        var op = osc(ac,"sawtooth", f3*(q===3?2:1), t);
        op.detune.value = dt[q];
        op.connect(lp3); op.start(t); op.stop(t+o.dur+ip.DEC+0.2);
      }
      adsr(g3.gain, t, ip.ATK, 0.2, 0.85, o.dur, ip.DEC, gain*0.14);
      return;
    }
    case "siren": {
      var g4 = ac.createGain(); g4.connect(out);
      var wv = ["sine","square","sawtooth"][Math.round(ip.WAVE)%3];
      var os = osc(ac, wv, noteFreq(o.midi+semis), t);

      var dur4 = Math.min(o.dur, ip.DEC);
      adsr(g4.gain, t, 0.01, 0.05, 0.8, dur4, ip.DEC*0.5, gain*0.2);
      os.stop(t+dur4+ip.DEC+0.2); lf.stop(t+dur4+ip.DEC+0.2);

    }

function monoVoice(E, o, kind, gain, semis){
  var ac = E.ac, c = E.ch[o.ch], ip = o.inst.p, t = o.when;
  var freq = noteFreq(o.midi + semis);
  var glide = (o.fx&&o.fx.G!=null) ? o.fx.G : ip.GLIDE;
  var m = c.mono;

  if(m && m.kind===kind && glide>0){
    m.setFreq(freq, t, glide);
    m.g.gain.cancelScheduledValues(t);
    m.g.gain.setTargetAtTime(m.peak, t, 0.01);
    m.until = t+o.dur;
    if(!o.sustain) scheduleMonoOff(E,o.ch,t+o.dur,ip);
    return;
  }
  if(m) releaseMono(E,o.ch,t);

  var g = ac.createGain(); g.connect(c.in);
  var oscs = [], setF;
  var peak;
  if(kind==="sub"){
    var o1 = osc(ac,"sine",freq,t);
    var sat = ac.createWaveShaper(); sat.curve = softCurve(1+ip.SAT*6);
    var pre = ac.createGain(); pre.gain.value = 1+ip.SAT;
    o1.connect(pre); pre.connect(sat); sat.connect(g);
    if(ip.DROP>0){
      o1.frequency.setValueAtTime(freq*Math.pow(2,ip.DROP/12), t);
      o1.frequency.exponentialRampToValueAtTime(freq, t+ip.DTIME);
    }
    oscs.push(o1);
    setF = function(f,tt,gl){ o1.frequency.cancelScheduledValues(tt); o1.frequency.setTargetAtTime(f,tt,Math.max(0.001,gl*0.4)); };
    peak = gain*0.62;
  } else {
    var det = ip.DET, cut = ip.CUT;
    var lp1 = ac.createBiquadFilter(); lp1.type="lowpass"; lp1.frequency.value=cut; lp1.Q.value=1+ip.RES*7;
    var lp2 = ac.createBiquadFilter(); lp2.type="lowpass"; lp2.frequency.value=cut; lp2.Q.value=0.7;
    var dr = ac.createWaveShaper(); dr.curve = softCurve(1+(ip.DRIVE==null?0.4:ip.DRIVE)*8);
    lp1.connect(lp2); lp2.connect(dr); dr.connect(g);
    var os1 = osc(ac,"sawtooth",freq,t); os1.detune.value = -det;
    var os2 = osc(ac,"sawtooth",freq,t); os2.detune.value = det;
    var os3 = osc(ac,"sawtooth",freq/2,t); os3.detune.value = det*0.3;
    /* slow chorus: two short modulated delays */
    var ch1 = ac.createDelay(0.05), lfo1 = osc(ac,"sine",0.23,t), lg1 = ac.createGain();
    ch1.delayTime.value = 0.012; lg1.gain.value = 0.004*(ip.CHOR==null?0.5:ip.CHOR);
    lfo1.connect(lg1); lg1.connect(ch1.delayTime);
    os1.connect(lp1); os2.connect(ch1); ch1.connect(lp1); os3.connect(lp1);
    oscs.push(os1,os2,os3,lfo1);
    if(kind==="wob"){
      var wl = osc(ac,"sine",ip.RATE,t), wg = ac.createGain();
      wg.gain.value = cut*0.9*(ip.DEPTH==null?0.8:ip.DEPTH);
      wl.connect(wg); wg.connect(lp1.frequency);
      oscs.push(wl);
    }
    setF = function(f,tt,gl){
      var s = Math.max(0.001, gl*0.4);
      os1.frequency.cancelScheduledValues(tt); os1.frequency.setTargetAtTime(f,tt,s);
      os2.frequency.cancelScheduledValues(tt); os2.frequency.setTargetAtTime(f,tt,s);
      os3.frequency.cancelScheduledValues(tt); os3.frequency.setTargetAtTime(f/2,tt,s);
    };
    peak = gain*0.20;
  }
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(peak, t+0.008);
  for(var i=0;i<oscs.length;i++) oscs[i].start(t);
  c.mono = { kind:kind, g:g, o:oscs, setFreq:setF, peak:peak, until:t+o.dur };
  if(!o.sustain) scheduleMonoOff(E,o.ch,t+o.dur,ip);
}
function scheduleMonoOff(E, ch, when, ip){
  var m = E.ch[ch].mono; if(!m) return;
  var dec = ip.DEC==null?0.3:ip.DEC;
  var g = m.g.gain;
  try{
    g.setValueAtTime(m.peak, when);
    g.exponentialRampToValueAtTime(0.0001, when+Math.max(0.02,dec*0.35));
  }catch(e){}
  var stopAt = when+Math.max(0.05,dec*0.4)+0.05;
  for(var i=0;i<m.o.length;i++){ try{ m.o[i].stop(stopAt); }catch(e){} }
  m.dead = true;
  var cc = E.ch[ch];
  if(cc.mono===m) cc.mono = null;
}

function parseHits(s){
  var out = [];
  if(!s) return out;
  var toks = s.split(" ");
  for(var i=0;i<toks.length;i++){
    var t = toks[i]; if(!t) continue;
    var g = 1, p = 0;
    var ci = t.indexOf("^");
    if(ci>=0){ p = parseFloat(t.substr(ci+1)); t = t.substr(0,ci); }
    var gi = t.indexOf("*");
    if(gi>=0){ g = parseFloat(t.substr(gi+1)); t = t.substr(0,gi); }
    out.push([t,p,g]);
  }
  return out;
}

/* library: presets first, then imports. */
var LIB = [];
function buildPresetLib(){
  for(var i=0;i<PRESETS.length;i++){
    var p = PRESETS[i], map = [];
    for(var j=0;j<16;j++) map.push(parseHits(p.s[j]));
    LIB.push({ id:"p"+i, name:p.name, kind:"preset", n:16, map:map, groove:p.g, bpm:p.bpm, bars:1 });
  }
}
function libFind(id){
  for(var i=0;i<LIB.length;i++) if(LIB[i].id===id) return LIB[i];
  return LIB[0];
}

function playBreak(E,o,gain,semis){
  var brk = o.brk, ip = o.inst.p, t = o.when, out = o.out||E.ch[o.ch].in;
  if(!brk) return;
  var idx = (o.slice||1)-1;
  var tune = (ip.TUNE||0)+semis;
  if(brk.kind==="preset"){
    var hits = brk.map[idx % brk.map.length] || [];
    for(var i=0;i<hits.length;i++)
      kitVoice(E, hits[i][0], t, out, gain*hits[i][2], hits[i][1]+tune);
    return;
  }
  var buf = o.buf;
  if(!buf) return;
  var sl = brk.slices;
  if(!sl||!sl.length) return;
  idx = Math.max(0, Math.min(sl.length-1, idx));
  var s = sl[idx];
  var start = s.t, end = (idx+1<sl.length? sl[idx+1].t : brk.end);
  var fx = o.fx||{};
  if(fx.O!=null){ start = brk.start + fx.O*(brk.end-brk.start); end = brk.end; }
  var rate = Math.pow(2, (tune+(s.p||0))/12);
  var slen = Math.max(0.01, end-start);
  var gate = (ip.GATE==null?1:ip.GATE);
  var len = Math.min(slen, Math.max(0.03, o.dur*gate*rate));
  var rev = (s.r?1:0) ^ (fx.B?1:0);
  var grain = 0;
  if(fx.T!=null && fx.T>0) grain = { size: 0.012+fx.T*0.10, dur: Math.max(0.05,o.dur*gate) };
  playBuf(E, buf, out, t, start, len, rate, gain*(s.g==null?1:s.g), rev, grain);
}
/* ------------------------------------------------------------ PROJECT */
var ROWS = 32, TPR = 6;
var proj = null, E = null, ac = null;
var play = { on:false, pos:0, row:0, next:0, sched:[], startedAt:0 };
var metOn = false;

function newCell(){ return {n:null,i:0,f:"",v:0}; }
function emptyRows(){ var r=[]; for(var i=0;i<ROWS;i++) r.push(null); return r; }

function newProject(name){
  var p = { name:name||"UNTITLED", bpm:170, swing:0, master:0.85, inst:[], chan:[], pat:[], song:[], ver:1 };
  p.inst = [
    {t:"brk",  n:"BREAK", p:instDefaults("brk")},
    {t:"sub",  n:"SUB",   p:instDefaults("sub")},
    {t:"reese",n:"REESE", p:instDefaults("reese")},
    {t:"chord",n:"STAB",  p:instDefaults("chord")},
    {t:"hoov", n:"HOOVER",p:instDefaults("hoov")},
    {t:"pad",  n:"PAD",   p:instDefaults("pad")},
    {t:"siren",n:"SIREN", p:instDefaults("siren")},
    {t:"kit",  n:"KIT",   p:instDefaults("kit")},
    {t:"wob",  n:"WOBBLE",p:instDefaults("wob")},
    {t:"smp",  n:"SMP",   p:instDefaults("smp")}
  ];
  var defInst = [0,0,1,2,3,6];
  for(var c=0;c<NCH;c++){
    p.chan.push({ inst:defInst[c], brk:(c<2?"p"+c:"p0"), vol:0.8, cut:1, res:0.1,
                  crush:0, dly:(c===4?0.25:(c===5?0.35:0)), rev:(c===4?0.2:0.05), mute:false, solo:false });
  }
  for(var i=0;i<256;i++) p.pat.push(null);
  return p;
}
function patNew(ch){
  for(var i=0;i<256;i++) if(!proj.pat[i]){ proj.pat[i] = {ch:ch, rows:emptyRows()}; return i; }
  return -1;
}
function patClone(id){
  var s = proj.pat[id]; if(!s) return -1;
  var n = patNew(s.ch); if(n<0) return -1;
  for(var i=0;i<ROWS;i++) proj.pat[n].rows[i] = s.rows[i]? {n:s.rows[i].n,i:s.rows[i].i,f:s.rows[i].f,v:s.rows[i].v} : null;
  return n;
}
function songRow(){ var a=[]; for(var i=0;i<NCH;i++) a.push(-1); return a; }

/* ------------------------------------------------------------- TIMING */
function rowDur(){ return 60/proj.bpm/4; }
function rowTime(r){ return (r&1) ? rowDur()*(proj.swing/100)*0.5 : 0; }

function fxOf(cell){
  var o = {};
  if(!cell||!cell.f) return o;
  var v = cell.v|0;
  switch(cell.f){
    case "9": o.O = v/256; break;
    case "R": o.R = Math.max(1,v); break;
    case "B": o.B = 1; break;
    case "P": o.P = (v>127? v-256 : v); break;
    case "G": o.G = v*0.004; break;
    case "C": o.C = v/255; break;
    case "T": o.T = v/255; break;
    case "V": o.V = v/128; break;
  }
  return o;
}
function cellAt(ch, pos, row){
  if(pos<0||pos>=proj.song.length) return null;
  var id = proj.song[pos][ch];
  if(id<0||!proj.pat[id]) return null;
  return proj.pat[id].rows[row];
}
/* rows until the next event on this channel, plus whether it glides */
function lookahead(ch,pos,row){
  var n = 0, p = pos, r = row;
  for(var k=1;k<=64;k++){
    r++;
    if(r>=ROWS){ r=0; p++; if(p>=proj.song.length) p = 0; if(p===pos&&r===row) break; }
    n = k;
    var c = cellAt(ch,p,r);
    if(c && c.n) return { rows:k, glide:(c.f==="G"), off:(c.n==="OFF") };
  }
  return { rows:16, glide:false, off:false };
}

function chanActive(c){
  var anySolo = false;
  for(var i=0;i<NCH;i++) if(proj.chan[i].solo) anySolo = true;
  return anySolo ? proj.chan[c].solo : !proj.chan[c].mute;
}

/* schedule one row of the song into the engine */
function scheduleRow(eng, pos, row, when, met){
  for(var ch=0; ch<NCH; ch++){
    if(!chanActive(ch)) continue;
    var cell = cellAt(ch,pos,row);
    if(!cell||!cell.n) continue;
    var cd = proj.chan[ch];
    var inst = proj.inst[cell.i!=null?cell.i:cd.inst] || proj.inst[0];
    var t = when + rowTime(row);
    if(cell.n==="OFF"){ eng.release(ch, t); continue; }
    var fx = fxOf(cell);
    var la = lookahead(ch,pos,row);
    var dur = la.rows*rowDur();
    var vel = (fx.V!=null? fx.V : 1);
    var o = { ch:ch, inst:inst, when:t, dur:dur, vel:vel, fx:fx, sustain:la.glide, out:null };
    if(cell.n.charAt(0)==="S"){
      o.slice = parseInt(cell.n.substr(1),10)||1;
      if(inst.t==="brk"){ o.brk = libFind(cd.brk); o.buf = o.brk.kind==="smp"? sampleBuf(eng, o.brk.sid) : null; }
    } else {
      o.midi = noteToMidi(cell.n);
      if(o.midi<0) continue;
      if(inst.t==="smp") o.buf = sampleBuf(eng, libFind(cd.brk).sid);
      if(inst.t==="brk"){ o.brk = libFind(cd.brk); o.slice = 1; o.buf = o.brk.kind==="smp"? sampleBuf(eng,o.brk.sid):null; }
    }
    eng.trigger(o);
    if(fx.R){
      var tick = rowDur()/TPR, k = fx.R, guard = 0;
      for(var tt = k*tick; tt < dur && guard<32; tt += k*tick, guard++){
        var o2 = {}; for(var q in o) o2[q]=o[q];
        o2.when = t+tt; o2.dur = Math.min(dur-tt, rowDur()); o2.sustain=false;
        o2.vel = vel*(1 - 0.04*guard);
        eng.trigger(o2);
      }
    }
  }
  if(met && row%4===0){
    kitVoice(eng, row===0?"CLICK":"STICK", when, eng.master, row===0?0.5:0.28, row===0?12:0);
  }
}

/* ---------------------------------------------------------- TRANSPORT */
var schedTimer = null;
function transportStart(){
  if(play.on) return;
  audioUnlock();
  play.on = true;
  play.sched = [];
  play.next = ac.currentTime + 0.06;
  if(!schedTimer) schedTimer = setInterval(tickScheduler, 25);
  mark();
}
function transportStop(){
  play.on = false;
  play.sched = [];
  if(E) E.panic();
  mark();
}
function transportToggle(){ play.on ? transportStop() : transportStart(); }

function tickScheduler(){
  if(!play.on||!ac) return;
  var ahead = ac.currentTime + 0.14;
  var guard = 0;
  while(play.next < ahead && guard++ < 64){
    if(proj.song.length===0) break;
    if(play.pos>=proj.song.length) play.pos = 0;
    scheduleRow(E, play.pos, play.row, play.next, metOn);
    play.sched.push({t:play.next, pos:play.pos, row:play.row});
    play.next += rowDur();
    play.row++;
    if(play.row>=ROWS){ play.row = 0; play.pos++; if(play.pos>=proj.song.length) play.pos = 0; }
  }
  while(play.sched.length>128) play.sched.shift();
}
/* what the ear hears right now */
function playhead(){
  if(!play.on) return null;
  var t = ac.currentTime, best = null;
  for(var i=0;i<play.sched.length;i++) if(play.sched[i].t<=t) best = play.sched[i];
  return best;
}

/* audition one cell immediately */
function audition(ch, cell){
  if(!cell||!cell.n||cell.n==="OFF") return;
  audioUnlock();
  var cd = proj.chan[ch];
  var inst = proj.inst[cell.i!=null?cell.i:cd.inst]||proj.inst[0];
  var fx = fxOf(cell);
  var o = { ch:ch, inst:inst, when:ac.currentTime+0.005, dur:rowDur()*4, vel:(fx.V!=null?fx.V:1), fx:fx };
  if(cell.n.charAt(0)==="S"){
    o.slice = parseInt(cell.n.substr(1),10)||1;
    if(inst.t==="brk"){ o.brk = libFind(cd.brk); o.buf = o.brk.kind==="smp"? sampleBuf(E,o.brk.sid):null; }
  } else {
    o.midi = noteToMidi(cell.n);
    if(inst.t==="smp") o.buf = sampleBuf(E, libFind(cd.brk).sid);
    if(inst.t==="brk"){ o.brk=libFind(cd.brk); o.slice=1; o.buf = o.brk.kind==="smp"? sampleBuf(E,o.brk.sid):null; }
  }
  E.trigger(o);
}
function auditionSlice(ch, n){
  audition(ch, {n:"S"+pad(n,2), i:proj.chan[ch].inst, f:"", v:0});
}
/* --------------------------------------------------------------- SAMPLES */
var SAMPLES = {};        /* id -> {id,name,sr,data(Float32 mono),dur,b:{}} */
var sidSeq = 1;

function sampleBuf(eng, sid){
  if(!sid||!eng) return null;
  var r = SAMPLES[sid]; if(!r) return null;
  if(!r.b) r.b = {};
  if(!r.b[eng.id]){
    var b = eng.ac.createBuffer(1, r.data.length, r.sr);
    b.getChannelData(0).set(r.data);
    r.b[eng.id] = b;
  }
  return r.b[eng.id];
}
function addSample(name, sr, data){
  var id = "s"+(sidSeq++)+"-"+Math.floor(now());
  SAMPLES[id] = { id:id, name:name, sr:sr, data:data, dur:data.length/sr, b:{} };
  return id;
}

/* --- analysis ------------------------------------------------------- */
function monoSum(buf){
  var n = buf.length, out = new Float32Array(n), nc = buf.numberOfChannels;
  for(var c=0;c<nc;c++){
    var d = buf.getChannelData(c);
    for(var i=0;i<n;i++) out[i] += d[i]/nc;
  }
  return out;
}
function peakOf(d){ var m=0; for(var i=0;i<d.length;i++){ var a=Math.abs(d[i]); if(a>m) m=a; } return m; }
function trimEdges(d){
  var pk = peakOf(d), th = Math.max(1e-4, pk*0.02), n = d.length;
  var s = 0, e = n-1;
  while(s<n && Math.abs(d[s])<th) s++;
  while(e>s && Math.abs(d[e])<th) e--;
  return [Math.max(0,s-64), Math.min(n-1,e+256)];
}
/* onset envelope, hop of 256 samples */
function onsetEnv(d, from, to){
  var hop = 256, n = Math.max(1,Math.floor((to-from)/hop)), env = new Float32Array(n);
  for(var i=0;i<n;i++){
    var s = from+i*hop, a = 0;
    for(var j=0;j<hop;j++){ var v = d[s+j]||0; a += v*v; }
    env[i] = Math.sqrt(a/hop);
  }
  return env;
}
function findOnsets(d, from, to, sr, sens){
  var hop = 256, env = onsetEnv(d, from, to), n = env.length;
  var flux = new Float32Array(n);
  for(var i=1;i<n;i++) flux[i] = Math.max(0, env[i]-env[i-1]*1.02);
  var mean = 0; for(var i=0;i<n;i++) mean += flux[i]; mean /= Math.max(1,n);
  var k = 2.6 - (sens==null?0.5:sens)*2.2;          /* sens 0..1 */
  var minGap = Math.floor(sr*0.045/hop);
  var out = [], last = -999;
  for(var i=1;i<n-1;i++){
    if(flux[i] > mean*k + 1e-4 && flux[i]>=flux[i-1] && flux[i]>=flux[i+1] && i-last>minGap){
      out.push(from + i*hop);
      last = i;
    }
  }
  return out;
}
/* beat period by autocorrelation of the onset flux, weighted towards 135 */
function estimateBpm(d, from, to, sr){
  var hop = 256, env = onsetEnv(d, from, to), n = env.length;
  if(n<8) return 170;
  var flux = new Float32Array(n), mean = 0;
  for(var i=1;i<n;i++) flux[i] = Math.max(0, env[i]-env[i-1]);
  for(var i=0;i<n;i++) mean += flux[i];
  mean /= n;
  for(var i=0;i<n;i++) flux[i] -= mean;
  var minLag = Math.max(2,Math.floor(0.24*sr/hop)), maxLag = Math.floor(0.92*sr/hop);
  var best = 0, bestLag = Math.floor(0.35*sr/hop);
  for(var lag=minLag; lag<=maxLag && lag<n-4; lag++){
    var sum = 0, cnt = 0;
    for(var i=0;i+lag<n;i++){ sum += flux[i]*flux[i+lag]; cnt++; }
    if(!cnt) continue;
    var corr = sum/cnt;
    var bpm = 60/(lag*hop/sr);
    var w = Math.exp(-0.5*Math.pow(Math.log(bpm/135)/Math.LN2/0.35,2));
    var sc = corr*w;
    if(sc>best){ best = sc; bestLag = lag; }
  }
  var bpm = 60/(bestLag*hop/sr);
  while(bpm<78) bpm *= 2;
  while(bpm>205) bpm /= 2;
  return bpm;
}
/* a break is a loop, so the length must be a whole number of bars. Test the
   free estimate and its common octave / triplet relatives against that. */
function analyzeTempo(d, from, to, sr){
  var free = estimateBpm(d, from, to, sr);
  var len = (to-from)/sr;
  var mults = [1, 2, 0.5, 1.5, 2/3, 3, 1/3, 4, 0.25];
  var best = null;
  for(var m=0;m<mults.length;m++){
    var bpm = free*mults[m];
    if(bpm<80||bpm>200) continue;
    for(var bars=1;bars<=8;bars*=2){
      var bpmC = 240*bars/len;
      if(Math.abs(bpmC-bpm)/bpm < 0.04){
        var w = Math.exp(-0.5*Math.pow(Math.log(bpmC/135)/Math.LN2/0.4,2))/(1+m*0.15);
        if(!best||w>best.w) best = {bpm:bpm, bars:bars, w:w};
      }
    }
  }
  if(best) return { bpm:best.bpm, bars:best.bars };
  return { bpm:free, bars:clamp(Math.round(len/(4*60/free)),1,8) };
}
function breakBpm(brk){ return 240*brk.bars/Math.max(0.01,(brk.end-brk.start)); }

function sliceEqual(brk, n){
  var sl = [], span = (brk.end-brk.start)/n;
  for(var i=0;i<n;i++) sl.push({ t: brk.start + i*span, p:0, r:0, g:1 });
  brk.slices = sl; brk.n = n;
}
function sliceTrans(brk, sens){
  var r = SAMPLES[brk.sid]; if(!r) return;
  var on = findOnsets(r.data, Math.floor(brk.start*r.sr), Math.floor(brk.end*r.sr), r.sr, sens);
  var sl = [];
  for(var i=0;i<on.length && sl.length<32;i++) sl.push({ t:on[i]/r.sr, p:0, r:0, g:1 });
  if(!sl.length||sl[0].t>brk.start+0.01) sl.unshift({t:brk.start,p:0,r:0,g:1});
  brk.slices = sl; brk.n = sl.length;
}
function snapToOnset(brk, t){
  var r = SAMPLES[brk.sid]; if(!r) return t;
  if(!brk._on) brk._on = findOnsets(r.data, Math.floor(brk.start*r.sr), Math.floor(brk.end*r.sr), r.sr, 0.5);
  var best = t, bd = 0.035;
  for(var i=0;i<brk._on.length;i++){
    var ot = brk._on[i]/r.sr, d = Math.abs(ot-t);
    if(d<bd){ bd = d; best = ot; }
  }
  return best;
}

/* --- import --------------------------------------------------------- */
function importBuffer(name, buf, opts){
  var data = monoSum(buf), sr = buf.sampleRate;
  var tr = trimEdges(data);
  var on = findOnsets(data, tr[0], tr[1], sr, 0.5);
  var start = tr[0];
  if(on.length && on[0]-tr[0] < sr*0.25) start = on[0];
  start = Math.max(0, start-Math.floor(sr*0.002));
  var sid = addSample(name, sr, data);
  var brk = {
    id:"u"+sid, name:name.toUpperCase().replace(/[^A-Z0-9]/g,"").substr(0,8)||"BREAK",
    kind:"smp", sid:sid, start:start/sr, end:tr[1]/sr, n:16, slices:[], bpm:0, bars:2,
    groove:groove(seq16())
  };
  var an = analyzeTempo(data, start, tr[1], sr);
  brk.bars = an.bars;
  brk.end = Math.min(data.length/sr, brk.start + brk.bars*4*60/an.bpm);
  brk.bpm = breakBpm(brk);
  sliceEqual(brk, Math.min(32, 16*brk.bars));
  if(opts&&opts.id){ brk.id = opts.id; brk.baked = true; }
  if(opts&&opts.bars){
    brk.bars = opts.bars;
    if(opts.bpm){ brk.end = Math.min(data.length/sr, brk.start + brk.bars*4*60/opts.bpm); }
    brk.bpm = breakBpm(brk);
    sliceEqual(brk, Math.min(32,16*brk.bars));
  }
  LIB.push(brk);
  if(!brk.baked) dbPutBreak(brk);
  return brk;
}
function decodeFiles(files, done){
  var list = [], i = 0;
  function next(){
    if(i>=files.length){ done(list); return; }
    var f = files[i++];
    if(/\.json$/i.test(f.name)){
      var fr = new FileReader();
      fr.onload = function(){ try{ loadProjectJSON(JSON.parse(fr.result)); }catch(e){ toast("BAD FILE"); } next(); };
      fr.readAsText(f); return;
    }
    var rd = new FileReader();
    rd.onload = function(){
      audioUnlock();
      ac.decodeAudioData(rd.result, function(buf){
        var nm = f.name.replace(/\.[^.]+$/,"");
        list.push(importBuffer(nm, buf));
        toast("+"+nm.toUpperCase().substr(0,8));
        next();
      }, function(){ toast("BAD AUDIO"); next(); });
    };
    rd.onerror = function(){ next(); };
    rd.readAsArrayBuffer(f);
  }
  next();
}
var fileEl = document.getElementById("f");
fileEl.addEventListener("change", function(){
  var fs = fileEl.files;
  if(!fs||!fs.length) return;
  toast("READING");
  decodeFiles(fs, function(l){
    if(l.length){ proj.chan[chanSel].brk = l[0].id; libSel = LIB.indexOf(l[0]); }
    fileEl.value = "";
    mark();
  });
});
function doImport(){ fileEl.click(); }

/* --- WAV ------------------------------------------------------------ */
function encodeWAV(chans, sr){
  var n = chans[0].length, nc = chans.length;
  var buf = new ArrayBuffer(44+n*nc*2), v = new DataView(buf);
  function str(o,s){ for(var i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); }
  str(0,"RIFF"); v.setUint32(4, 36+n*nc*2, true); str(8,"WAVEfmt ");
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,nc,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*nc*2,true); v.setUint16(32,nc*2,true);
  v.setUint16(34,16,true); str(36,"data"); v.setUint32(40,n*nc*2,true);
  var o = 44;
  for(var i=0;i<n;i++){
    for(var c=0;c<nc;c++){
      var s = Math.max(-1,Math.min(1,chans[c][i]));
      v.setInt16(o, s<0? s*0x8000 : s*0x7FFF, true); o+=2;
    }
  }
  return buf;
}
function b64(ab){
  var b = new Uint8Array(ab), s = "", CH = 0x8000;
  for(var i=0;i<b.length;i+=CH) s += String.fromCharCode.apply(null, b.subarray(i,i+CH));
  return btoa(s);
}
function unb64(s){
  var bin = atob(s), b = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) b[i] = bin.charCodeAt(i);
  return b.buffer;
}
function wavToFloat(ab){
  var v = new DataView(ab);
  var nc = v.getUint16(22,true), sr = v.getUint32(24,true), bits = v.getUint16(34,true);
  var off = 12;
  while(off < ab.byteLength-8){
    var id = String.fromCharCode(v.getUint8(off),v.getUint8(off+1),v.getUint8(off+2),v.getUint8(off+3));
    var sz = v.getUint32(off+4,true);
    if(id==="data"){
      var n = Math.floor(sz/(2*nc)), out = new Float32Array(n), o = off+8;
      for(var i=0;i<n;i++){
        var acc = 0;
        for(var c=0;c<nc;c++){ acc += v.getInt16(o,true)/32768; o+=2; }
        out[i] = acc/nc;
      }
      return {sr:sr, data:out};
    }
    off += 8+sz+(sz&1);
  }
  return null;
}
function download(name, blob){
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
/* --------------------------------------------------------------- STORE */
var DB = null, dbReady = false;
function dbOpen(cb){
  var rq;
  try{ rq = indexedDB.open("dubplate", 1); }catch(e){ cb&&cb(); return; }
  rq.onupgradeneeded = function(e){
    var d = e.target.result;
    if(!d.objectStoreNames.contains("projects")) d.createObjectStore("projects",{keyPath:"name"});
    if(!d.objectStoreNames.contains("library"))  d.createObjectStore("library",{keyPath:"id"});
  };
  rq.onsuccess = function(){ DB = rq.result; dbReady = true; cb&&cb(); };
  rq.onerror = function(){ cb&&cb(); };
}
function dbPut(store, val, cb){
  if(!DB) return cb&&cb();
  try{
    var tx = DB.transaction(store,"readwrite");
    tx.objectStore(store).put(val);
    tx.oncomplete = function(){ cb&&cb(); };
    tx.onerror = function(){ cb&&cb(); };
  }catch(e){ cb&&cb(); }
}
function dbAll(store, cb){
  if(!DB) return cb([]);
  try{
    var out = [], tx = DB.transaction(store,"readonly");
    var rq = tx.objectStore(store).openCursor();
    rq.onsuccess = function(e){
      var c = e.target.result;
      if(c){ out.push(c.value); c.continue(); } else cb(out);
    };
    rq.onerror = function(){ cb([]); };
  }catch(e){ cb([]); }
}
function dbDel(store, key, cb){
  if(!DB) return cb&&cb();
  try{
    var tx = DB.transaction(store,"readwrite");
    tx.objectStore(store).delete(key);
    tx.oncomplete = function(){ cb&&cb(); };
  }catch(e){ cb&&cb(); }
}

function pcm16(f32){
  var o = new Int16Array(f32.length);
  for(var i=0;i<f32.length;i++){ var s = Math.max(-1,Math.min(1,f32[i])); o[i] = s<0? s*0x8000 : s*0x7FFF; }
  return o;
}
function unpcm16(i16){
  var o = new Float32Array(i16.length);
  for(var i=0;i<i16.length;i++) o[i] = i16[i]/32768;
  return o;
}
function dbPutBreak(brk){
  if(brk.kind!=="smp") return;
  var r = SAMPLES[brk.sid];
  if(!r) return;
  dbPut("library", {
    id:brk.id, name:brk.name, sid:brk.sid, sname:r.name, sr:r.sr,
    pcm:pcm16(r.data).buffer, start:brk.start, end:brk.end, n:brk.n,
    slices:brk.slices, bpm:brk.bpm, bars:brk.bars, groove:brk.groove
  });
}
function dbLoadLib(cb){
  dbAll("library", function(rows){
    for(var i=0;i<rows.length;i++){
      var r = rows[i];
      if(SAMPLES[r.sid]) continue;
      SAMPLES[r.sid] = { id:r.sid, name:r.sname, sr:r.sr, data:unpcm16(new Int16Array(r.pcm)), b:{} };
      SAMPLES[r.sid].dur = SAMPLES[r.sid].data.length/r.sr;
      LIB.push({ id:r.id, name:r.name, kind:"smp", sid:r.sid, start:r.start, end:r.end,
                 n:r.n, slices:r.slices, bpm:r.bpm, bars:r.bars, groove:r.groove||groove(seq16()) });
    }
    cb&&cb();
  });
}

/* ------------------------------------------------------- SERIALISATION */
function serialize(embed){
  var o = { name:proj.name, bpm:proj.bpm, swing:proj.swing, master:proj.master, ver:1,
            inst:proj.inst, chan:proj.chan, song:proj.song, pat:[], breaks:[] };
  for(var i=0;i<256;i++) if(proj.pat[i]) o.pat.push({id:i, ch:proj.pat[i].ch, rows:proj.pat[i].rows});
  var used = {};
  for(var c=0;c<NCH;c++) used[proj.chan[c].brk] = 1;
  if(proj.chan.smp) used[proj.chan.smp] = 1;
  for(var k=0;k<LIB.length;k++){
    var b = LIB[k];
    if(b.kind!=="smp"||!used[b.id]) continue;
    var e = { id:b.id, name:b.name, kind:"smp", start:b.start, end:b.end, n:b.n,
              slices:b.slices, bpm:b.bpm, bars:b.bars, sid:b.sid };
    if(embed){
      var r = SAMPLES[b.sid];
      if(r) e.wav = b64(encodeWAV([r.data], r.sr));
    }
    o.breaks.push(e);
  }
  return o;
}
function loadProjectJSON(o){
  if(!o||!o.chan) { toast("BAD FILE"); return; }
  var p = newProject(o.name||"UNTITLED");
  p.bpm = o.bpm||170; p.swing = o.swing||0; p.master = (o.master==null?0.85:o.master);
  if(o.inst&&o.inst.length) p.inst = o.inst;
  p.chan = o.chan; p.song = o.song||[];
  for(var i=0;i<(o.pat||[]).length;i++){
    var q = o.pat[i];
    p.pat[q.id] = { ch:q.ch, rows:q.rows };
  }
  for(var k=0;k<(o.breaks||[]).length;k++){
    var b = o.breaks[k];
    if(libHas(b.id)) continue;
    var sid = b.sid;
    if(b.wav){
      var w = wavToFloat(unb64(b.wav));
      if(w){ sid = addSample(b.name, w.sr, w.data); }
    }
    var nb = { id:b.id, name:b.name, kind:"smp", sid:sid, start:b.start, end:b.end,
               n:b.n, slices:b.slices, bpm:b.bpm, bars:b.bars, groove:groove(seq16()) };
    LIB.push(nb); dbPutBreak(nb);
  }
  proj = p;
  applyMix();
  editPat = [0,0,0,0,0,0];
  for(var c=0;c<NCH;c++) if(proj.song.length) editPat[c] = Math.max(0,proj.song[0][c]);
  toast("LOADED"); mark();
}
function libHas(id){ for(var i=0;i<LIB.length;i++) if(LIB[i].id===id) return true; return false; }

/* ---------------------------------------------------------- WAV RENDER */
var rendering = false;
function renderWAV(){
  if(rendering||!proj.song.length) return;
  rendering = true; toast("RENDERING");
  mark();
  var sr = 44100;
  var total = proj.song.length*ROWS*rowDur()+2.5;
  var OAC = window.OfflineAudioContext||window.webkitOfflineAudioContext;
  var oac;
  try{ oac = new OAC(2, Math.ceil(total*sr), sr); }
  catch(e){ rendering=false; toast("NO ROOM"); return; }
  var eng = createEngine(oac);
  for(var c=0;c<NCH;c++) eng.setMix(c, proj.chan[c]);
  eng.setDelayTime(60/proj.bpm*0.75);
  var t = 0.05;
  for(var pos=0;pos<proj.song.length;pos++){
    for(var r=0;r<ROWS;r++){
      scheduleRow(eng, pos, r, t, false);
      t += rowDur();
    }
  }
  function done(buf){
    var chans = [];
    for(var i=0;i<buf.numberOfChannels;i++) chans.push(buf.getChannelData(i));
    download((proj.name||"UNTITLED")+".wav", new Blob([encodeWAV(chans, sr)],{type:"audio/wav"}));
    rendering = false; toast("SAVED"); mark();
  }
  var pr = oac.startRendering();
  if(pr && pr.then) pr.then(done, function(){ rendering=false; toast("FAILED"); mark(); });
  else oac.oncomplete = function(e){ done(e.renderedBuffer); };
}

/* -------------------------------------------------------- EXPORT SLICES */
function exportKit(){
  var brk = libFind(proj.chan[chanSel].brk);
  if(brk.kind!=="smp"){ toast("NO SAMPLE"); return; }
  var r = SAMPLES[brk.sid];
  if(!r) return;
  /* one WAV per slice, concatenated download is not possible without zip,
     so write a single WAV of the trimmed break plus a JSON slice map */
  var from = Math.floor(brk.start*r.sr), to = Math.floor(brk.end*r.sr);
  var seg = r.data.subarray(from,to);
  download(brk.name+".wav", new Blob([encodeWAV([seg], r.sr)],{type:"audio/wav"}));
  var map = { name:brk.name, sampleRate:r.sr, bars:brk.bars, bpm:brk.bpm,
              slices:brk.slices.map(function(s){ return { start:Math.round((s.t-brk.start)*r.sr), pitch:s.p, reverse:!!s.r, gain:s.g }; }) };
  download(brk.name+".json", new Blob([JSON.stringify(map,null,1)],{type:"application/json"}));
  toast("EXPORTED");
}

var wavePeaks = null, wavePeaksFor = null;
function peaksFor(brk, n){
  var key = brk.id+":"+n+":"+brk.start+":"+brk.end;
  if(wavePeaksFor===key) return wavePeaks;
  var r = SAMPLES[brk.sid];
  if(!r) return null;
  var from = Math.floor(brk.start*r.sr), to = Math.floor(brk.end*r.sr);
  var step = Math.max(1,Math.floor((to-from)/n)), out = new Float32Array(n);
  for(var i=0;i<n;i++){
    var s = from+i*step, m = 0;
    for(var j=0;j<step;j+=3){ var v = Math.abs(r.data[s+j]||0); if(v>m) m=v; }
    out[i] = m;
  }
  wavePeaks = out; wavePeaksFor = key;
  return out;
}

function auditionBreakSlice(brk, i){
  audioUnlock();
  var inst = null;
  for(var k=0;k<proj.inst.length;k++) if(proj.inst[k].t==="brk"){ inst = proj.inst[k]; break; }

  E.trigger({ ch:chanSel, inst:inst, when:ac.currentTime+0.005, dur:rowDur()*4, vel:1, fx:{},

/* SPREAD: slices land on the grid step that matches their position in the
   break, so the loop plays back in time at the song tempo. */
function spread(){
  var ch = chanSel, id = curPat(ch), rows = proj.pat[id].rows;
  var brk = libFind(proj.chan[ch].brk);
  var inst = proj.chan[ch].inst;
  for(var i=0;i<ROWS;i++) rows[i] = null;
  if(brk.kind==="preset"){
    var g = brk.groove;
    for(var i=0;i<ROWS;i++) rows[i] = { n:"S"+pad(g[i%g.length],2), i:inst, f:"", v:0 };
  } else {
    var span = Math.max(0.001, brk.end-brk.start), steps = brk.bars*16, over = 0;
    for(var i=0;i<brk.slices.length;i++){
      var r = Math.round((brk.slices[i].t-brk.start)/span*steps);
      if(r<0) r = 0;
      if(r>=ROWS){ over++; continue; }
      rows[r] = { n:"S"+pad(i+1,2), i:inst, f:"", v:0 };
    }
    if(over) toast("2 BARS ONLY");
  }
  touch();
  if(brk.kind==="preset") toast("SPREAD");
  scrn = 1; mark();
}

/* -------------------------------------------------------------- DISK */
var projList = [], listLoaded = false;
function refreshList(){ dbAll("projects",function(r){ projList = r; listLoaded = true; mark(); }); }
function drawDisk(){
  var y0 = contentTop(), h = contentH();
  rect(0,y0,W,h,BLUE);
  if(!listLoaded) refreshList();
  var bw = Math.floor(W/4);
  button(0,y0,bw-1,13,"SAVE",function(){ saveProject(false); refreshList(); });
  button(bw,y0,bw-1,13,"NEW",function(){
    askConfirm("NEW SONG?",function(){ proj = demoProject(true); applyMix(); toast("NEW"); mark(); });
  });
  button(bw*2,y0,bw-1,13,"NAME",function(){ openKeyboard(proj.name,function(v){ proj.name=v; touch(); mark(); }); });
  button(bw*3,y0,W-bw*3,13,"MET",function(){ metOn=!metOn; mark(); }, metOn);
  var y = y0+15;
  button(0,y,bw-1,13,"EXP",exportJSON);
  button(bw,y,bw-1,13,"IMP",doImport);
  button(bw*2,y,bw-1,13,"WAV",renderWAV);
  button(bw*3,y,W-bw*3,13,"DEMO",function(){
    askConfirm("LOAD DEMO?",function(){ proj = demoProject(false); applyMix(); toast("DEMO"); mark(); });
  });
  y += 15;
  button(0,y,bw-1,13,"MIDI",initMIDI,midiOn);
  button(bw,y,bw-1,13,"KIT",exportKit);
  y += 16;
  text(2,y,proj.name.substr(0,16),ORANGE);
  text(W-tw("SONGS")-2,y,"SONGS",WHITE);
  y += 10;
  rect(0,y-2,W,1,BLACK);
  for(var i=0;i<projList.length && y<y0+h-12;i++){
    (function(p,y){
      var on = (p.name===proj.name);
      panel(0,y,W,12,on?WHITE:BLUE,on);
      text(3,y+3,p.name.substr(0,18), on?BLUE:WHITE);
      textR(W-3,y+3, pad(p.bpm,3), on?BLUE:ORANGE);
      hit(0,y,W,12,{
        tap:function(){ askConfirm("LOAD?",function(){ loadProjectJSON(p); }); },
        hold:function(){ askConfirm("DELETE?",function(){ dbDel("projects",p.name,refreshList); }); }
      });
    })(projList[i], y);
    y += 13;
  }
}
/* ------------------------------------------------------------ DRAWER */
var FXLIST = ["--","9","R","B","P","G","C","T","V"];
var drwOct = 3;

function openDrawer(ch,pid,row){
  drawer = { ch:ch, pid:pid, row:row };
  var c = proj.pat[pid].rows[row];
  if(c && c.n && c.n.charAt(0)!=="S" && c.n!=="OFF"){
    var o = parseInt(c.n.charAt(2),10);
    if(!isNaN(o)) drwOct = o;
  }
  mark();
}
function drwCell(create){
  var p = proj.pat[drawer.pid];
  var c = p.rows[drawer.row];
  if(!c && create){
    var lc = chanCell(drawer.ch);
    c = { n:lc.n, i:proj.chan[drawer.ch].inst, f:"", v:0 };
    p.rows[drawer.row] = c;
  }
  return c;
}
function drawDrawer(){
  if(!drawer) return;
  hit(0,0,W,H,{tap:function(){}, hold:function(){}});
  var h = 104, y = H-TAB-h;
  rect(0,y-2,W,h+2,BLACK);
  panel(0,y,W,h,BLUE,false);
  var c = drwCell(false);
  var cell = c || {n:"---",i:proj.chan[drawer.ch].inst,f:"",v:0};
  var inst = proj.inst[cell.i] || proj.inst[0];

  text(3,y+3,"ROW "+hx(drawer.row,2),ORANGE);
  text(50,y+3,cell.n+"  "+hx(cell.i,1)+"  "+(cell.f?cell.f+hx(cell.v,2):"---"),WHITE);
  button(W-15,y+1,14,10,I_X,function(){ drawer=null; mark(); });

  var py = y+13;
  var kind = (inst.t==="brk"||inst.t==="kit");
  if(kind){
    var pw = Math.floor(W/8), ph2 = 15;
    for(var i=0;i<16;i++){
      var cx = (i%8)*pw, cy = py+Math.floor(i/8)*ph2;
      var nm = "S"+pad(i+1,2);
      (function(nm,cx,cy,pw,ph2){
        var on = (cell.n===nm);
        panel(cx,cy,pw-1,ph2-1,on?WHITE:BLUE,on);
        textC(cx,cy+((ph2-8)>>1),pw-1,nm.substr(1),on?BLUE:WHITE);
        hit(cx,cy,pw,ph2,{tap:function(){
          var cc = drwCell(true); cc.n = nm; lastCell[drawer.ch] = {n:cc.n,i:cc.i,f:cc.f,v:cc.v};
          audition(drawer.ch,cc); touch(); mark();
        }});
      })(nm,cx,cy,pw,ph2);
    }
  } else {
    var nw = Math.floor(W/6), nh = 15;
    for(var i=0;i<12;i++){
      var cx = (i%6)*nw, cy = py+Math.floor(i/6)*nh;
      var nm = NOTENAMES[i]+drwOct;
      (function(nm,cx,cy,nw,nh){
        var on = (cell.n===nm);
        panel(cx,cy,nw-1,nh-1,on?WHITE:BLUE,on);
        textC(cx,cy+((nh-8)>>1),nw-1,nm,on?BLUE:WHITE);
        hit(cx,cy,nw,nh,{tap:function(){
          var cc = drwCell(true); cc.n = nm; lastCell[drawer.ch] = {n:cc.n,i:cc.i,f:cc.f,v:cc.v};
          audition(drawer.ch,cc); touch(); mark();
        }});
      })(nm,cx,cy,nw,nh);
    }
  }
  var oy = py+31;
  if(!kind){
    stepper(0,oy,44,11,"OCT"+drwOct, function(){ drwOct=clamp(drwOct-1,2,5); mark(); },
                                     function(){ drwOct=clamp(drwOct+1,2,5); mark(); });
  } else {
    text(3,oy+3,(inst.t==="kit")?KITLIST[(parseInt((cell.n||"S01").substr(1),10)||1)-1]:libFind(proj.chan[drawer.ch].brk).name,ORANGE);
  }
  stepper(46,oy,66,11,hx(cell.i,1)+" "+proj.inst[cell.i].n.substr(0,4),
    function(){ var cc=drwCell(true); cc.i=(cc.i+proj.inst.length-1)%proj.inst.length; touch(); mark(); },
    function(){ var cc=drwCell(true); cc.i=(cc.i+1)%proj.inst.length; touch(); mark(); });
  button(114,oy,32,11,"OFF",function(){
    var cc = drwCell(true); cc.n = "OFF"; touch(); mark();
  }, cell.n==="OFF");
  button(148,oy,32,11,"DEL",function(){
    proj.pat[drawer.pid].rows[drawer.row] = null; touch(); mark();
  });
  button(W-40,oy,39,11,"OK",function(){ drawer=null; mark(); });

  var fy = oy+13, fw = Math.floor(W/9);
  for(var i=0;i<FXLIST.length;i++){
    (function(f,x){
      var on = ((cell.f||"--")===f) || (f==="--"&&!cell.f);
      panel(x,fy,fw-1,12,on?WHITE:BLUE,on);
      textC(x,fy+3,fw-1,f,on?BLUE:WHITE);
      hit(x,fy,fw,12,{tap:function(){
        var cc = drwCell(true);
        cc.f = (f==="--")? "" : f;
        if(cc.f&&!cc.v) cc.v = defFxVal(cc.f);
        lastCell[drawer.ch] = {n:cc.n,i:cc.i,f:cc.f,v:cc.v};
        touch(); mark();
      }});
    })(FXLIST[i], i*fw);
  }
  var vy = fy+14;
  text(3,vy+3,"VAL",ORANGE);
  hbar(26,vy,W-72,11, cell.v/255, null, hx(cell.v,2)+" "+fxHint(cell.f,cell.v),
    function(v){ var cc=drwCell(true); cc.v = Math.round(v*255); touch(); mark(); });
  tinyButton(W-44,vy,20,11,I_LT,function(){ var cc=drwCell(true); cc.v=clamp(cc.v-1,0,255); touch(); mark(); });
  tinyButton(W-22,vy,21,11,I_RT,function(){ var cc=drwCell(true); cc.v=clamp(cc.v+1,0,255); touch(); mark(); });
}
function defFxVal(f){
  switch(f){ case "9": return 32; case "R": return 3; case "B": return 1; case "P": return 12;
             case "G": return 24; case "C": return 128; case "T": return 64; case "V": return 128; }
  return 0;
}
function fxHint(f,v){
  switch(f){
    case "9": return Math.round(v/256*100)+"%";
    case "R": return v+"T";
    case "P": return ((v>127?v-256:v)>0?"+":"")+(v>127?v-256:v);
    case "G": return Math.round(v*4)+"MS";
    case "C": return Math.round(40*Math.pow(400,v/255))+"HZ";
    case "T": return Math.round(12+v/255*100)+"MS";
    case "V": return Math.round(v/128*100)+"%";
  }
  return "";
}
/* --------------------------------------------------------------- DEMO */
function setRow(id,row,n,i,f,v){ proj.pat[id].rows[row] = {n:n,i:i,f:f||"",v:v||0}; }
function fillGroove(id,inst,brk){
  var g = brk.groove||groove(seq16());
  for(var i=0;i<ROWS;i++) proj.pat[id].rows[i] = {n:"S"+pad(g[i%g.length],2), i:inst, f:"", v:0};
}
function demoProject(blank){
  var p = newProject(blank?"UNTITLED":"DUBPLATE");
  proj = p;
  if(blank){
    for(var i=0;i<4;i++) p.song.push(songRow());
    editPat = [0,0,0,0,0,0];
    for(var c=0;c<NCH;c++){ var id = patNew(c); editPat[c] = id; }
    unsaved = false;
    return p;
  }
  p.bpm = 170; p.swing = 14;
  p.chan[0].crush = 0.35; p.chan[0].rev = 0.08;
  p.chan[1].crush = 0.5; p.chan[1].dly = 0.18; p.chan[1].vol = 0.6;
  p.chan[1].brk = "p1";
  p.chan[2].vol = 0.85;
  p.chan[3].vol = 0.6; p.chan[3].cut = 0.62; p.chan[3].rev = 0.1;
  p.chan[4].vol = 0.55; p.chan[4].dly = 0.35; p.chan[4].rev = 0.3;
  p.chan[5].vol = 0.5; p.chan[5].dly = 0.5; p.chan[5].rev = 0.35;

  var pA = patNew(0), pA2 = patNew(0), pB = patNew(1), pS = patNew(2),
      pR = patNew(3), pT = patNew(4), pF = patNew(5);
  fillGroove(pA, 0, libFind("p0"));
  fillGroove(pA2, 0, libFind("p0"));
  /* the chopped second bar: rolls and a reverse */
  setRow(pA2,16,"S01",0,"",0); setRow(pA2,17,"S13",0,"R",2); setRow(pA2,18,"S13",0,"",0);
  setRow(pA2,19,"S05",0,"B",1); setRow(pA2,20,"S05",0,"",0); setRow(pA2,22,"S11",0,"",0);
  setRow(pA2,24,"S13",0,"R",3); setRow(pA2,28,"S05",0,"",0); setRow(pA2,30,"S16",0,"P",249);
  /* BRK2: think chops */
  setRow(pB,4,"S05",0,"",0); setRow(pB,12,"S13",0,"B",1);
  setRow(pB,20,"S05",0,"R",3); setRow(pB,26,"S07",0,"P",7); setRow(pB,30,"S13",0,"",0);
  /* SUB */
  setRow(pS,0,"C-2",1,"",0); setRow(pS,10,"C-2",1,"",0); setRow(pS,14,"G-2",1,"G",24);
  setRow(pS,16,"C-2",1,"",0); setRow(pS,24,"D#2",1,"",0); setRow(pS,28,"C-2",1,"G",30);
  /* REESE */
  setRow(pR,0,"C-3",2,"",0); setRow(pR,12,"D#3",2,"G",40); setRow(pR,20,"C-3",2,"G",40);
  setRow(pR,28,"A#2",2,"G",60);
  /* STAB */
  setRow(pT,6,"C-4",3,"V",160); setRow(pT,14,"C-4",3,"V",128);
  setRow(pT,22,"D#4",3,"V",150); setRow(pT,30,"A#3",3,"V",120);
  /* FX siren */
  setRow(pF,0,"C-4",6,"",0); setRow(pF,24,"OFF",6,"",0);

  p.song.push([pA,-1,pS,-1,-1,-1]);
  p.song.push([pA,-1,pS,pR,-1,-1]);
  p.song.push([pA2,pB,pS,pR,pT,-1]);
  p.song.push([pA2,pB,pS,pR,pT,pF]);
  editPat = [pA,pB,pS,pR,pT,pF];
  songSel = {pos:0,ch:0};
  unsaved = false;
  return p;
}

/* ------------------------------------------------------------ STARTER BANK
   bake.py drops base64 WAVs from breaks/ between these markers. The public
   build ships the mechanism empty. */
/* BAKE:START */
var BAKED = [];
/* BAKE:END */
function loadBaked(){
  if(!BAKED.length||!ac) return;
  var i = 0;
  (function next(){
    if(i>=BAKED.length){ mark(); return; }
    var b = BAKED[i++];
    try{
      ac.decodeAudioData(unb64(b.wav), function(buf){
        importBuffer(b.n, buf, {id:"b"+b.n, bars:b.bars, bpm:b.bpm});
        mark(); next();
      }, next);
    }catch(e){ next(); }
  })();
}

/* ------------------------------------------------------------------ MIDI */
var midiOn = false;
function initMIDI(){
  if(!navigator.requestMIDIAccess){ toast("NO MIDI"); return; }
  navigator.requestMIDIAccess().then(function(m){
    m.inputs.forEach(function(inp){ inp.onmidimessage = onMIDI; });
    m.onstatechange = function(){ m.inputs.forEach(function(inp){ inp.onmidimessage = onMIDI; }); };
    midiOn = true; toast("MIDI ON"); mark();
  }, function(){ toast("NO MIDI"); mark(); });
}
function onMIDI(e){
  var d = e.data;
  if(!d||d.length<3) return;
  var cmd = d[0]&0xF0, note = d[1], vel = d[2];
  if(cmd!==0x90||vel===0) return;
  audioUnlock();
  var ch = chanSel, inst = proj.inst[proj.chan[ch].inst], cell;
  if(inst.t==="brk"||inst.t==="kit") cell = {n:"S"+pad(((note-36)&15)+1,2), i:proj.chan[ch].inst, f:"", v:0};
  else cell = {n:midiToNote(clamp(note,36,83)), i:proj.chan[ch].inst, f:"", v:0};
  lastCell[ch] = cell;
  audition(ch, cell);
  if(recOn&&play.on) recordCell(ch, cell);
  padHot[((note-36)&15)] = now();
  mark();
}

/* --------------------------------------------------------------- BOOT */
var unlocked = false;
function audioUnlock(){
  if(!ac) return;
  if(ac.state==="suspended"){ try{ ac.resume(); }catch(e){} }
  if(!unlocked){
    try{
      var b = ac.createBuffer(1,1,ac.sampleRate), s = ac.createBufferSource();
      s.buffer = b; s.connect(ac.destination); s.start(0);
      unlocked = true;
    }catch(e){}
  }
}
function autosave(){
  if(unsaved && proj && dbReady) saveProject(true);
}
function restoreLast(){
  var n = null;
  try{ n = localStorage.getItem("dp.last"); }catch(e){}
  if(!n) return;
  dbAll("projects", function(rows){
    for(var i=0;i<rows.length;i++) if(rows[i].name===n){ loadProjectJSON(rows[i]); return; }
  });
}

function draw(){
  dirty = false;
  regions = [];
  rect(0,0,W,H,BLUE);
  switch(scrn){
    case 0: drawSong(); break;
    case 1: drawPattern(); break;
    case 2: drawPads(); break;
    case 3: drawChop(); break;
    case 4: drawInst(); break;
    case 5: drawMix(); break;
    default: drawDisk(); break;
  }
  drawTransport();
  drawTabs();
  if(drawer) drawDrawer();
  if(keyboard) drawKeyboard();
  drawToast();
  if(confirmBox) drawConfirm();
}
function frameLoop(){
  var hot = false;
  for(var k in padHot) if(now()-padHot[k]<200) hot = true;
  if(dirty || play.on || hot || (now()-toastT)<1700) draw();
  requestAnimationFrame(frameLoop);
}

function boot(){
  buildFont();
  resize();
  bindInput();
  var AC = window.AudioContext||window.webkitAudioContext;
  try{ ac = new AC(); }catch(e){ ac = null; }
  if(ac) E = createEngine(ac);
  buildPresetLib();
  proj = demoProject(false);
  applyMix();
  if(E) E.setDelayTime(60/proj.bpm*0.75);
  loadBaked();
  dbOpen(function(){ dbLoadLib(function(){ restoreLast(); mark(); }); });
  setInterval(autosave, 30000);
  window.addEventListener("blur", function(){ autosave(); });
  document.addEventListener("visibilitychange", function(){ if(document.hidden) autosave(); });
  frameLoop();
}
boot();
</script>
